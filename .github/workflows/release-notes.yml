name: Generate release notes

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  generate-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace("refs/tags/", "");
            // Previous tag (or the first one if none) for the commit range.
            const allTags = (
              await github.rest.git.listMatchingRefs({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: "refs/tags/",
                per_page: 100,
              })
            ).data.map((r) => r.ref.replace("refs/tags/", ""));
            const prevTag = allTags.filter((t) => t !== tag).sort().pop();

            let body;
            if (prevTag) {
              const changelog = await github.rest.repos.generateReleaseNotes({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                target_commitish: "master",
                previous_tag_name: prevTag,
              });
              body = changelog.data.body;
            } else {
              body = `Release ${tag} of the Siltflow Importer Obsidian plugin.`;
            }

            // Update the draft/notes on the release. The Release workflow runs
            // in parallel and may create it a moment later — retry briefly.
            let release = null;
            for (let attempt = 0; attempt < 10 && !release; attempt++) {
              const releases = (
                await github.rest.repos.listReleases({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  per_page: 100,
                })
              ).data;
              release = releases.find((r) => r.tag_name === tag) || null;
              if (!release && attempt < 9) {
                await new Promise((r) => setTimeout(r, 3000));
              }
            }
            if (release) {
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
                body,
              });
              console.log(`Updated release notes for ${tag}.`);
            } else {
              await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: tag,
                body,
                generate_release_notes: false,
              });
              console.log(`Created release ${tag} with generated notes.`);
            }
